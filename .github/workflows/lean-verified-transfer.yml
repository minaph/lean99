name: Lean v4.34.1 verified transfer
on:
  push:
    branches:
      - chore/lean-4.34.1-transfer-20261011
jobs:
  chunk-official-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Download, verify, and split official Linux x64 archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --max-time 900 -o lean-4.34.1-linux.tar.zst https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst
          echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  lean-4.34.1-linux.tar.zst" | sha256sum -c -
          split -b 190000000 -d -a 2 lean-4.34.1-linux.tar.zst part-
          sha256sum part-* > pieces.sha256
          wc -c part-*
      - uses: actions/upload-artifact@v4
        with:
          name: lean-4.34.1-part-00
          path: part-00
          compression-level: 0
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: lean-4.34.1-part-01
          path: part-01
          compression-level: 0
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: lean-4.34.1-part-02
          path: part-02
          compression-level: 0
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: lean-4.34.1-part-03
          path: part-03
          compression-level: 0
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: lean-4.34.1-checksums
          path: pieces.sha256
          retention-days: 5
